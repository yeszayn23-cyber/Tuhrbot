```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق طُهْر المصغر</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #2e1065 0%, #581c87 50%, #3b0764 100%);
            color: #f3e8ff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .arabic-title {
            font-family: 'Amiri', serif;
        }

        /* تحريك أزهار اللافندر بفعل الرياح */
        @keyframes sway {
            0% { transform: rotate(0deg) translateY(0); }
            50% { transform: rotate(8deg) translateY(-5px); }
            100% { transform: rotate(0deg) translateY(0); }
        }

        .lavender-flower {
            animation: sway 4s ease-in-out infinite;
            transform-origin: bottom center;
        }

        .lavender-flower-delayed {
            animation: sway 5s ease-in-out infinite 1s;
            transform-origin: bottom center;
        }

        /* تنسيق العجلة والدائريات */
        .wheel-container {
            position: relative;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: conic-gradient(#7e22ce 0deg 120deg, #9333ea 120deg 240deg, #a855f7 240deg 360deg);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-inner {
            width: 210px;
            height: 210px;
            border-radius: 50%;
            background: #1e1b4b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* تأثيرات عامة */
        .glass-card {
            background: rgba(45, 27, 105, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(216, 180, 254, 0.2);
            border-radius: 1.5rem;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #2e1065;
        }
        ::-webkit-scrollbar-thumb {
            background: #7e22ce;
            border-radius: 3px;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen relative p-4">

    <!-- خلفية تفاعلية ومتحركة لأزهار اللافندر -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden z-0 opacity-40" id="lavender-bg">
        <div class="absolute top-4 left-6 text-3xl lavender-flower">🪻</div>
        <div class="absolute top-12 right-8 text-2xl lavender-flower-delayed">🪻</div>
        <div class="absolute top-1/3 left-2 text-4xl lavender-flower-delayed">🪻</div>
        <div class="absolute top-1/2 right-4 text-3xl lavender-flower">🪻</div>
        <div class="absolute bottom-20 left-10 text-4xl lavender-flower">🪻</div>
        <div class="absolute bottom-24 right-12 text-3xl lavender-flower-delayed">🪻</div>
    </div>

    <!-- الحاوية الرئيسية -->
    <div class="w-full max-w-md z-10 flex flex-col flex-grow justify-between pb-16">
        
        <!-- الهيدر واسم التطبيق المزخرف -->
        <header class="text-center pt-4 pb-2">
            <h1 class="arabic-title text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-200 via-purple-300 to-pink-200 drop-shadow-md">
                طُهْر
            </h1>
            <p class="text-xs text-purple-300 tracking-widest mt-1">ملاذ الطهارة والعناية بالفقه والجسد</p>
        </header>

        <!-- المحتوى الديناميكي حسب الحالة -->
        <main id="main-content" class="flex-grow flex flex-col items-center justify-center my-4">
            <!-- يتم تعبئتها بواسطة الجافاسكريبت -->
        </main>

        <!-- شريط التنقل السفلي -->
        <nav id="bottom-nav" class="hidden fixed bottom-0 left-0 right-0 bg-purple-950/90 backdrop-blur-md border-t border-purple-800/50 py-3 px-6 flex justify-around items-center z-50 max-w-md mx-auto rounded-t-2xl shadow-lg">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-purple-300 hover:text-white transition">
                <i class="fa-solid fa-circle-notch text-xl"></i>
                <span class="text-[10px] mt-1">العجلة</span>
            </button>
            <button onclick="switchTab('library')" id="nav-library" class="flex flex-col items-center text-purple-400 hover:text-white transition">
                <i class="fa-solid fa-book-open text-xl"></i>
                <span class="text-[10px] mt-1">المكتبة والفقه</span>
            </button>
            <button onclick="switchTab('ai')" id="nav-ai" class="flex flex-col items-center text-purple-400 hover:text-white transition">
                <i class="fa-solid fa-sparkles text-xl"></i>
                <span class="text-[10px] mt-1">مرشدة طهر</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center text-purple-400 hover:text-white transition hidden" id="admin-nav-btn">
                <i class="fa-solid fa-gear text-xl"></i>
                <span class="text-[10px] mt-1">الإدارة</span>
            </button>
        </nav>

    </div>

    <!-- نافذة منبثقة مخصصة (بديل لـ alert) -->
    <div id="custom-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card p-6 w-full max-w-xs text-center shadow-2xl">
            <h3 id="modal-title" class="text-lg font-bold text-purple-200 mb-2">تنبيه</h3>
            <p id="modal-message" class="text-sm text-purple-300 mb-4">رسالة هنا...</p>
            <button onclick="closeModal()" class="w-full bg-purple-700 hover:bg-purple-600 text-white py-2 rounded-xl text-sm font-medium transition shadow-md">حسناً</button>
        </div>
    </div>

    <script>
        // إعدادات وبيانات الحالة
        const MY_ADMIN_ID = "ADMIN_SPECIAL_ID_12345"; // الأيدي الخاص بك للتحكم والإدارة
        let currentUser = localStorage.getItem('tohr_user_id') || 'user_' + Math.random().toString(36.substring(2, 9));
        localStorage.setItem('tohr_user_id', currentUser);

        // تخزين البيانات المحلية للمستخدم
        let userData = JSON.parse(localStorage.getItem('tohr_data_' + currentUser)) || {
            password: null,
            cycleLength: 28,
            periodLength: 7,
            lastPeriodDate: new Date().toISOString().split('T')[0],
            customBg: null
        };

        // قاعدة بيانات المحتوى (يمكن تعديلها من لوحة المشرف)
        let appContent = JSON.parse(localStorage.getItem('tohr_global_content')) || {
            ghuslRules: "أحكام الغسل والطهارة:\n1. النية بقلب صادق.\n2. التسمية وغسل الكفين ثلاثاً.\n3. الوضوء الكامل.\n4. إيصال الماء لأصول الشعور وباقي الجسد.",
            haydRules: "أحكام الحائض:\n1. يحرم عليها الصلاة والصيام حتى تطهر وتغتسل.\n2. لا تقرأ القرآن مساً من المصحف عدا عن ظهر قلب.\n3. قضاء الصيام دون الصلاة.",
            pdfs: [
                { title: "فقه المرأة المسلمة - مختصر الطهارة", url: "#" },
                { title: "رسالة في أحكام الحيض والنفاس", url: "#" }
            ]
        };

        let currentActiveTab = 'home';

        // تهيئة التطبيق عند التحميل
        window.onload = function() {
            applyCustomBackground();
            checkInitialState();
        };

        function showModal(title, message) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function applyCustomBackground() {
            if (userData.customBg) {
                document.body.style.backgroundImage = `url('${userData.customBg}')`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
            }
        }

        function checkInitialState() {
            if (!userData.password) {
                renderSetupPassword();
            } else {
                renderLogin();
            }
        }

        // واجهة إعداد كلمة السر لأول مرة
        function renderSetupPassword() {
            document.getElementById('bottom-nav').classList.add('hidden');
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="glass-card p-6 w-full max-w-xs mx-auto text-center shadow-xl animate-fade-in">
                    <div class="text-3xl mb-2">🔒</div>
                    <h2 class="text-xl font-bold mb-1 text-purple-200">تعيين كلمة السر</h2>
                    <p class="text-xs text-purple-300 mb-4">لحماية خصوصيتك في تطبيق طُهْر</p>
                    <input type="password" id="new-pass" placeholder="أدخل كلمة السر" class="w-full bg-purple-900/50 border border-purple-700/50 rounded-xl px-4 py-2.5 text-center text-white mb-3 text-sm focus:outline-none focus:border-purple-400">
                    <input type="password" id="confirm-pass" placeholder="تأكيد كلمة السر" class="w-full bg-purple-900/50 border border-purple-700/50 rounded-xl px-4 py-2.5 text-center text-white mb-4 text-sm focus:outline-none focus:border-purple-400">
                    <button onclick="savePassword()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-2.5 rounded-xl font-medium text-sm shadow-lg hover:opacity-90 transition">حفظ والبدء</button>
                </div>
            `;
        }

        function savePassword() {
            const p1 = document.getElementById('new-pass').value;
            const p2 = document.getElementById('confirm-pass').value;
            if(!p1 || p1.length < 4) {
                showModal('تنبيه', 'يجب أن تكون كلمة السر 4 أحرف أو أرقام على الأقل.');
                return;
            }
            if(p1 !== p2) {
                showModal('خطأ', 'كلمتا السر غير متطابقتين.');
                return;
            }
            userData.password = p1;
            localStorage.setItem('tohr_data_' + currentUser, JSON.stringify(userData));
            renderLogin();
        }

        // واجهة إدخال كلمة السر عند الدخول في كل مرة
        function renderLogin() {
            document.getElementById('bottom-nav').classList.add('hidden');
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="glass-card p-6 w-full max-w-xs mx-auto text-center shadow-xl animate-fade-in">
                    <div class="text-4xl mb-2">🪻</div>
                    <h2 class="text-xl font-bold mb-1 text-purple-200">مرحباً بكِ في طُهْر</h2>
                    <p class="text-xs text-purple-300 mb-4">أدخلي كلمة السر للمتابعة</p>
                    <input type="password" id="login-pass" placeholder="كلمة السر" class="w-full bg-purple-900/50 border border-purple-700/50 rounded-xl px-4 py-2.5 text-center text-white mb-4 text-sm focus:outline-none focus:border-purple-400">
                    <button onclick="verifyLogin()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-2.5 rounded-xl font-medium text-sm shadow-lg hover:opacity-90 transition">دخول</button>
                </div>
            `;
        }

        function verifyLogin() {
            const p = document.getElementById('login-pass').value;
            if(p === userData.password) {
                document.getElementById('bottom-nav').classList.remove('hidden');
                // التحقق هل هو الأيدي الخاص بك لإظهار الإعدادات الخاصة
                if(currentUser === MY_ADMIN_ID || localStorage.getItem('is_admin') === 'true') {
                    document.getElementById('admin-nav-btn').classList.remove('hidden');
                }
                switchTab('home');
            } else {
                showModal('خطأ', 'كلمة السر غير صحيحة.');
            }
        }

        // التبديل بين التبويبات الرئيسية
        function switchTab(tab) {
            currentActiveTab = tab;
            // تحديث الأيقونات في شريط التنقل
            ['home', 'library', 'ai', 'settings'].forEach(t => {
                const el = document.getElementById(`nav-${t}`);
                if(el) {
                    if(t === tab) {
                        el.classList.remove('text-purple-400');
                        el.classList.add('text-white', 'scale-110');
                    } else {
                        el.classList.add('text-purple-400');
                        el.classList.remove('text-white', 'scale-110');
                    }
                }
            });

            if(tab === 'home') renderHomeTab();
            else if(tab === 'library') renderLibraryTab();
            else if(tab === 'ai') renderAiTab();
            else if(tab === 'settings') renderSettingsTab();
        }

        // تبويب العجلة ومعلومات الدورة
        function renderHomeTab() {
            const main = document.getElementById('main-content');
            
            // حساب أيام الدورة
            let lastDate = new Date(userData.lastPeriodDate);
            let today = new Date();
            let diffTime = Math.abs(today - lastDate);
            let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) % userData.cycleLength;
            let daysLeft = userData.cycleLength - diffDays;

            main.innerHTML = `
                <div class="w-full flex flex-col items-center animate-fade-in">
                    <!-- الأزرار الثلاثة الصغيرة العلوية -->
                    <div class="flex gap-2 mb-4">
                        <button onclick="openCycleModal()" class="bg-purple-900/60 hover:bg-purple-800 border border-purple-600/40 px-3 py-1.5 rounded-full text-[11px] text-purple-200 shadow transition flex items-center gap-1">
                            <i class="fa-solid fa-pen-to-square"></i> تعديل الدورة
                        </button>
                        <button onclick="showModal('حالة الطهارة', 'أنتِ في الأيام العادية بين الدورات. حافظي على أوردتكِ وطهارتكِ.')" class="bg-purple-900/60 hover:bg-purple-800 border border-purple-600/40 px-3 py-1.5 rounded-full text-[11px] text-purple-200 shadow transition">
                            <i class="fa-solid fa-droplet"></i> حالة الطهارة
                        </button>
                        <button onclick="showModal('نصيحة اليوم', 'قال الإمام النووي رحمه الله: طهارة الباطن بطهارة القلب، وطهارة الظاهر بغسل الأعضاء.')" class="bg-purple-900/60 hover:bg-purple-800 border border-purple-600/40 px-3 py-1.5 rounded-full text-[11px] text-purple-200 shadow transition">
                            <i class="fa-solid fa-heart"></i> نصيحة
                        </button>
                    </div>

                    <!-- العجلة في المنتصف -->
                    <div class="wheel-container my-2">
                        <div class="wheel-inner text-center p-4">
                            <span class="text-xs text-purple-300">متبقي للدورة القادمة</span>
                            <span class="text-3xl font-bold text-white my-1">${daysLeft}</span>
                            <span class="text-[10px] text-purple-400">يوم تقريباً</span>
                        </div>
                    </div>

                    <!-- معلومات الدورة الحالية -->
                    <div class="glass-card w-full p-4 mt-4 text-center">
                        <h3 class="text-sm font-bold text-purple-200 mb-1">معلومات دورتك الحالية</h3>
                        <div class="flex justify-around text-xs text-purple-300 mt-2">
                            <div><span>مدة الدورة:</span> <strong class="text-white">${userData.cycleLength} يوم</strong></div>
                            <div><span>أيام الحيض:</span> <strong class="text-white">${userData.periodLength} يوم</strong></div>
                        </div>
                    </div>
                </div>

                <!-- نموذج تعديل معلومات الدورة المنبثق -->
                <div id="cycle-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
                    <div class="glass-card p-6 w-full max-w-xs shadow-2xl">
                        <h3 class="text-lg font-bold text-purple-200 mb-3 text-center">إدخال معلومات الدورة</h3>
                        <label class="text-xs text-purple-300 block mb-1">كم مدة الدورة الكاملة (بالأيام)؟</label>
                        <input type="number" id="in-cycle" value="${userData.cycleLength}" class="w-full bg-purple-900/50 border border-purple-700/50 rounded-xl px-3 py-2 text-white mb-3 text-sm">
                        
                        <label class="text-xs text-purple-300 block mb-1">كم مدة أيام الحيض؟</label>
                        <input type="number" id="in-period" value="${userData.periodLength}" class="w-full bg-purple-900/50 border border-purple-700/50 rounded-xl px-3 py-2 text-white mb-3 text-sm">

                        <label class="text-xs text-purple-300 block mb-1">تاريخ آخر دورة نزلت:</label>
                        <input type="date" id="in-date" value="${userData.lastPeriodDate}" class="w-full bg-purple-900/50 border border-purple-700/50 rounded-xl px-3 py-2 text-white mb-4 text-sm">
                        
                        <div class="flex gap-2">
                            <button onclick="saveCycleData()" class="flex-1 bg-purple-700 hover:bg-purple-600 text-white py-2 rounded-xl text-sm font-medium">حفظ</button>
                            <button onclick="closeCycleModal()" class="flex-1 bg-purple-900/80 hover:bg-purple-900 text-purple-300 py-2 rounded-xl text-sm font-medium">إلغاء</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function openCycleModal() {
            document.getElementById('cycle-modal').classList.remove('hidden');
        }

        function closeCycleModal() {
            document.getElementById('cycle-modal').classList.add('hidden');
        }

        function saveCycleData() {
            userData.cycleLength = parseInt(document.getElementById('in-cycle').value) || 28;
            userData.periodLength = parseInt(document.getElementById('in-period').value) || 7;
            userData.lastPeriodDate = document.getElementById('in-date').value || new Date().toISOString().split('T')[0];
            
            localStorage.setItem('tohr_data_' + currentUser, JSON.stringify(userData));
            closeCycleModal();
            renderHomeTab();
        }

        // تبويب المكتبة والفقه (أحكام الغسل، أحكام الحائض، رف الكتب PDF)
        let librarySubTab = 'ghusl';
        function renderLibraryTab() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="w-full flex flex-col animate-fade-in">
                    <!-- تبويبات فرعية للمكتبة -->
                    <div class="flex bg-purple-950/60 p-1 rounded-2xl mb-4 border border-purple-800/40">
                        <button onclick="switchLibSub('ghusl')" class="flex-1 py-1.5 text-xs font-medium rounded-xl transition ${librarySubTab === 'ghusl' ? 'bg-purple-700 text-white shadow' : 'text-purple-300'}">الغسل والطهارة</button>
                        <button onclick="switchLibSub('hayd')" class="flex-1 py-1.5 text-xs font-medium rounded-xl transition ${librarySubTab === 'hayd' ? 'bg-purple-700 text-white shadow' : 'text-purple-300'}">أحكام الحائض</button>
                        <button onclick="switchLibSub('books')" class="flex-1 py-1.5 text-xs font-medium rounded-xl transition ${librarySubTab === 'books' ? 'bg-purple-700 text-white shadow' : 'text-purple-300'}">رف الكتب PDF</button>
                    </div>

                    <div id="lib-content" class="glass-card p-4 min-h-[280px]">
                        <!-- يتم ملؤها حسب التبويب الفرعي -->
                    </div>
                </div>
            `;
            renderLibSubContent();
        }

        function switchLibSub(sub) {
            librarySubTab = sub;
            renderLibraryTab();
        }

        function renderLibSubContent() {
            const container = document.getElementById('lib-content');
            if(librarySubTab === 'ghusl') {
                container.innerHTML = `
                    <h3 class="text-sm font-bold text-purple-200 mb-2 flex items-center gap-2"><i class="fa-solid fa-water"></i> أحكام الغسل والطهارة</h3>
                    <div class="text-xs text-purple-200 leading-relaxed whitespace-pre-line">${appContent.ghuslRules}</div>
                `;
            } else if(librarySubTab === 'hayd') {
                container.innerHTML = `
                    <h3 class="text-sm font-bold text-purple-200 mb-2 flex items-center gap-2"><i class="fa-solid fa-book-bookmark"></i> أحكام الحائض والنفاس</h3>
                    <div class="text-xs text-purple-200 leading-relaxed whitespace-pre-line">${appContent.haydRules}</div>
                `;
            } else if(librarySubTab === 'books') {
                let booksHtml = `<h3 class="text-sm font-bold text-purple-200 mb-3 flex items-center gap-2"><i class="fa-solid fa-file-pdf"></i> مكتبة الكتب والمراجع PDF</h3><div class="space-y-2">`;
                appContent.pdfs.forEach((b, idx) => {
                    booksHtml += `
                        <div class="bg-purple-900/40 border border-purple-700/30 p-3 rounded-xl flex items-center justify-between">
                            <span class="text-xs text-purple-100 font-medium">${b.title}</span>
                            <div class="flex gap-2">
                                <a href="${b.url}" target="_blank" class="bg-purple-700/80 hover:bg-purple-700 px-2.5 py-1 rounded-lg text-[10px] text-white transition">تصفح</a>
                                <a href="${b.url}" download class="bg-pink-700/80 hover:bg-pink-700 px-2.5 py-1 rounded-lg text-[10px] text-white transition">تحميل</a>
                            </div>
                        </div>
                    `;
                });
                booksHtml += `</div>`;
                container.innerHTML = booksHtml;
            }
        }

        // تبويب المرشدة الذكية (ملاذ المرأة)
        function renderAiTab() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="w-full flex flex-col h-[380px] animate-fade-in">
                    <div class="text-center mb-2">
                        <h3 class="text-sm font-bold text-purple-200">مرشدة طُهْر الذكية</h3>
                        <p class="text-[10px] text-purple-300">اسألي عن الفقه، أحكام الطهارة، والعناية بالصحة</p>
                    </div>
                    <div id="chat-messages" class="glass-card flex-grow p-3 overflow-y-auto space-y-3 text-xs mb-2 flex flex-col">
                        <div class="bg-purple-900/60 p-2.5 rounded-2xl max-w-[85%] self-start text-purple-200">
                            أهلاً بكِ أختي العزيزة في ملاذكِ الآمن. أنا هنا للإجابة عن كل ما يتعلق بفقه الطهارة، أحكام الدورة، والعناية الذاتية. تفضلي بسؤالي!
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <input type="text5" id="chat-input" placeholder="اكتبي سؤالك هنا..." class="flex-grow bg-purple-900/50 border border-purple-700/50 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-400">
                        <button onclick="sendChatMessage()" class="bg-purple-700 hover:bg-purple-600 text-white px-4 py-2 rounded-xl text-xs font-medium transition shadow"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>
            `;
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if(!msg) return;

            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML += `<div class="bg-pink-900/60 p-2.5 rounded-2xl max-w-[85%] self-end text-purple-100">${msg}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // استدعاء Gemini API
            const loadingId = 'loading_' + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="bg-purple-900/60 p-2.5 rounded-2xl max-w-[85%] self-start text-purple-300 italic">جاري البحث في الفقه والنصوص...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            const systemPrompt = "أنتِ مرشدة فقهية وصحية لطيفة وواعية متخصصة في مساعدة النساء في تطبيق طهر الإسلامي لتتبع الدورة الشهرية وأحكام الغسل والطهارة وفق المذاهب الإسلامية المعتبرة. أجيبي باختصار ولطف وحكمة.";
            
            try {
                const apiKey = "";
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: msg }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });
                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text || "عذراً، حدث خطأ في الاتصال، يمكنكِ مراجعة قسم أحكام الغسل في المكتبة.";
                
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="bg-purple-900/60 p-2.5 rounded-2xl max-w-[85%] self-start text-purple-200 leading-relaxed">${text}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="bg-purple-900/60 p-2.5 rounded-2xl max-w-[85%] self-start text-purple-200">عذراً، يرجى المحاولة لاحقاً.</div>`;
            }
        }
