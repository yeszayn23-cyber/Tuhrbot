<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuhr - تطهير وعناية</title>
    <style>
        :root {
            --bg-purple: #f3eef8;
            --main-purple: #9b7fd4;
            --dark-purple: #5c4b8a;
            --branch-brown: #8B5A2B;
            --leaf-green: #4CAF50;
            --pot-brown: #A0522D;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-purple);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* إطار الحشائش الخضراء على الجوانب */
        .grass-frame {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            pointer-events: none;
            border: 15px solid transparent;
            border-image: linear-gradient(to bottom, #68bb59, #388e3c) 1;
            /* تصميم مجازي لإطار حشائش خفيف */
            background-image: 
                radial-gradient(circle, var(--leaf-green) 4px, transparent 5px),
                radial-gradient(circle, #68bb59 3px, transparent 4px);
            background-size: 30px 30px;
            background-position: top left, bottom right;
            opacity: 0.15;
            z-index: 10;
        }

        /* حاوية الشاشات */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: absolute;
            transition: all 0.5s ease;
            padding: 20px;
            z-index: 5;
        }

        .screen.active {
            display: flex;
        }

        /* شاشة البداية وكلمة Tuhr */
        .brand-title {
            font-size: 3.5rem;
            color: var(--branch-brown);
            font-weight: bold;
            position: relative;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        /* بتلات شجرة القطن الصغيرة على الكلمة */
        .brand-title::after {
            content: ' 🍃 🌿 🍃 ';
            font-size: 1.2rem;
            position: absolute;
            top: -15px;
            right: 10px;
        }

        /* الصناديق الزجاجية النظيفة (Cards) */
        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(155, 127, 212, 0.2);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .card h2 {
            margin-bottom: 15px;
            color: var(--dark-purple);
            font-size: 1.3rem;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #d1c4e9;
            border-radius: 10px;
            outline: none;
            font-size: 1rem;
            background: #faf8ff;
            text-align: center;
        }

        .input-field:focus {
            border-color: var(--main-purple);
            box-shadow: 0 0 5px rgba(155, 127, 212, 0.4);
        }

        .btn {
            background-color: var(--main-purple);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: var(--dark-purple);
        }

        /* شاشة أصيص اللافندر */
        .lavender-scene {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* عيدان اللافندر والبتلات */
        .lavender-plant {
            display: flex;
            gap: 15px;
            margin-bottom: -5px;
            height: 140px;
            align-items: flex-end;
        }

        .stem-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .stem {
            width: 3px;
            height: 100px;
            background-color: var(--leaf-green);
            border-radius: 2px;
        }

        .petals {
            display: flex;
            flex-direction: column;
            gap: 3px;
            position: absolute;
            top: -20px;
        }

        .petal {
            width: 12px;
            height: 8px;
            background-color: var(--main-purple);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .petal.fallen {
            opacity: 0;
            transform: translateY(40px) scale(0.5);
        }

        /* الأصيص البني الأنيق */
        .pot-container {
            width: 140px;
            height: 110px;
            background: linear-gradient(135deg, #b0653b, #8b4513);
            border-radius: 0 0 25px 25px;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-top: 8px solid #703814;
        }

        /* العداد المكتوب على الأصيص */
        .pot-counter {
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        /* زر الإعدادات المخفي كجزء من الفخار */
        .settings-btn {
            position: absolute;
            bottom: 8px;
            right: 12px;
            background: rgba(0,0,0,0.2);
            border: none;
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .settings-btn:hover {
            background: rgba(0,0,0,0.4);
        }

        /* شاشة الإعدادات الصغيرة */
        .settings-modal {
            display: none;
            position: absolute;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 20;
            width: 280px;
            text-align: center;
        }
        .settings-modal.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="grass-frame"></div>

    <div id="screen-password" class="screen active">
        <div class="brand-title">Tuhr</div>
        <div class="card">
            <h2>تأمين التطبيق 🌿</h2>
            <p style="font-size: 0.85rem; color: #666; margin-bottom: 15px;">الرجاء إنشاء كلمة سر خاصة لحمايتك</p>
            <input type="password" id="new-pass" class="input-field" placeholder="كلمة السر الجديدة">
            <input type="password" id="confirm-pass" class="input-field" placeholder="تأكيد كلمة السر">
            <button class="btn" onclick="savePassword()">حفظ ودخول</button>
        </div>
    </div>

    <div id="screen-cycle-info" class="screen">
        <div class="brand-title">Tuhr</div>
        <div class="card">
            <h2>معلومات الدورة 🪻</h2>
            <p style="font-size: 0.85rem; color: #666; margin-bottom: 15px;">أدخلي تاريخ آخر دورة ومدة دورتك المعتادة</p>
            <label style="font-size: 0.8rem; display: block; text-align: right;">تاريخ آخر حيض:</label>
            <input type="date" id="last-period" class="input-field">
            <label style="font-size: 0.8rem; display: block; text-align: right;">مدة الدورة (بالأيام):</label>
            <input type="number" id="cycle-length" class="input-field" value="28" min="20" max="45">
            <button class="btn" onclick="saveCycleInfo()">ابدأ الرحلة</button>
        </div>
    </div>

    <div id="screen-lavender" class="screen">
        <div class="lavender-scene">
            <div class="lavender-plant">
                <div class="stem-group">
                    <div class="petals" id="stem1">
                        <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
                    </div>
                    <div class="stem"></div>
                </div>
                <div class="stem-group">
                    <div class="petals" id="stem2">
                        <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
                    </div>
                    <div class="stem"></div>
                </div>
                <div class="stem-group">
                    <div class="petals" id="stem3">
                        <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
                    </div>
                    <div class="stem"></div>
                </div>
            </div>

            <div class="pot-container">
                <div class="pot-counter" id="countdown-text">باقي 5 أيام</div>
                <button class="settings-btn" onclick="toggleSettings()" title="الإعدادات">⚙</button>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="settings-modal">
        <h3 style="color: var(--dark-purple); margin-bottom: 10px;">إعدادات الدورة</h3>
        <input type="date" id="edit-last-period" class="input-field">
        <button class="btn" onclick="closeSettings()">حفظ التعديلات</button>
    </div>

    <script>
        // التحقق من البيانات المخزنة محلياً عند فتح التطبيق
        window.onload = function() {
            const savedPass = localStorage.getItem('tuhr_pass');
            const cycleData = localStorage.getItem('tuhr_cycle');

            if (!savedPass) {
                showScreen('screen-password');
            } else if (!cycleData) {
                showScreen('screen-cycle-info');
            } else {
                showScreen('screen-lavender');
                updateLavenderView();
            }
        };

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function savePassword() {
            const p1 = document.getElementById('new-pass').value;
            const p2 = document.getElementById('confirm-pass').value;
            if(!p1 || p1 !== p2) {
                alert('الرجاء التأكد من تطابق كلمة السر');
                return;
            }
            localStorage.setItem('tuhr_pass', p1);
            showScreen('screen-cycle-info');
        }

        function saveCycleInfo() {
            const lastDate = document.getElementById('last-period').value;
            const length = document.getElementById('cycle-length').value;
            if(!lastDate) {
                alert('الرجاء اختيار تاريخ آخر دورة');
                return;
            }
            localStorage.setItem('tuhr_cycle', JSON.stringify({ lastDate, length }));
            showScreen('screen-lavender');
            updateLavenderView();
        }

        function updateLavenderView() {
            // محاكاة حساب الأيام المتبقية وتساقط البتلات بناءً على التخزين
            const data = JSON.parse(localStorage.getItem('tuhr_cycle'));
            if(data) {
                // حساب بسيط تقريبي لتجربة الواجهة
                document.getElementById('countdown-text').innerText = "باقي 12 يوم";
            }
        }

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.classList.toggle('active');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('active');
        }
    </script>
</body>
</html>
