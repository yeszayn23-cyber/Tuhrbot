<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuhr - الطُّهر</title>
    <style>
        :root {
            --bg-deep: #2e1a35;
            --purple-overlay: rgba(58, 30, 68, 0.85);
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --accent-lavender: #9b7fd4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cinzel', 'Traditional Arabic', serif;
        }

        body {
            background-color: #1a0f20;
            color: #f7f3f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* حاوية التطبيق بحجم هاتف أنيق */
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background: linear-gradient(135deg, #382142 0%, #201128 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 4px solid var(--gold);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* إطار النباتات الفاخر على الجوانب */
        .floral-frame-left, .floral-frame-right {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50px;
            background: rgba(20, 10, 25, 0.6);
            z-index: 10;
            pointer-events: none;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        .floral-frame-left { left: 0; border-right: 2px solid var(--gold); }
        .floral-frame-right { right: 0; border-left: 2px solid var(--gold); }

        /* المحتوى الداخلي */
        .content-area {
            flex: 1;
            padding: 20px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            z-index: 5;
            overflow-y: auto;
        }

        /* العنوان الملكي Tuhr */
        .brand-header {
            text-align: center;
            margin-top: 15px;
            margin-bottom: 20px;
        }
        .brand-title {
            font-size: 2.2rem;
            color: var(--gold-light);
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.5);
        }
        .brand-subtitle {
            font-size: 0.8rem;
            color: #bfa8cc;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        /* الشاشات */
        .screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }
        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* الحقول الزجاجية الملكية */
        .royal-card {
            background: rgba(65, 35, 78, 0.7);
            border: 1px solid var(--gold);
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            margin-bottom: 15px;
        }

        .royal-input {
            width: 100%;
            background: rgba(30, 15, 38, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            text-align: center;
            font-size: 1rem;
            margin: 10px 0;
            outline: none;
        }
        .royal-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .royal-btn {
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #1a0f20;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 1rem;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(212, 175, 55,.3);
        }
        .royal-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        /* شاشة أصيص اللافندر الرئيسية */
        .lavender-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-top: 10px;
        }

        .pot-box {
            width: 180px;
            height: 140px;
            background: linear-gradient(135deg, #4d2659, #2b1133);
            border: 3px solid var(--gold);
            border-radius: 0 0 40px 40px;
            position: relative;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }

        .pot-gear {
            width: 60px;
            height: 60px;
            border: 2px dashed var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: -30px;
            background: #2b1133;
            box-shadow: 0 0 10px rgba(212,175,55,0.4);
        }

        .countdown-label {
            font-size: 0.85rem;
            color: var(--gold-light);
            margin-top: 20px;
            font-weight: bold;
            text-align: center;
        }

        .pot-settings-trigger {
            position: absolute;
            bottom: 8px;
            right: 12px;
            background: none;
            border: 1px solid var(--gold);
            color: var(--gold);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* شريط التنقل السفلي */
        .bottom-nav {
            height: 60px;
            background: rgba(30, 15, 38, 0.95);
            border-top: 2px solid var(--gold);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 20;
            padding: 0 40px;
        }

        .nav-icon {
            color: var(--gold-light);
            font-size: 1.2rem;
            cursor: pointer;
            background: none;
            border: none;
            transition: 0.2s;
        }
        .nav-icon:hover {
            color: var(--gold);
            transform: scale(1.1);
        }

        /* نافذة الإعدادات */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- إطارات جانبية نباتية -->
        <div class="floral-frame-left"></div>
        <div class="floral-frame-right"></div>

        <div class="content-area">
            <div class="brand-header">
                <div class="brand-title">طُّهـر</div>
                <div class="brand-subtitle">Aurora Celestial</div>
            </div>

            <!-- 1. الشاشة الأولى: إدخال أو تسجيل كلمة السر -->
            <div id="screen-password" class="screen active">
                <div class="royal-card">
                    <h3 style="color: var(--gold); margin-bottom: 10px;" id="pass-title">Invoke Password</h3>
                    <p style="font-size: 0.8rem; color: #d0bce0; margin-bottom: 15px;" id="pass-desc">أدخلي كلمة السر للولوج إلى التطبيق</p>
                    <input type="password" id="pass-input" class="royal-input" placeholder="كلمة السر">
                    <button class="royal-btn" onclick="handlePassword()">دخول 🌿</button>
                </div>
            </div>

            <!-- 2. شاشة إدخال معلومات الدورة (لأول مرة) -->
            <div id="screen-cycle" class="screen">
                <div class="royal-card">
                    <h3 style="color: var(--gold); margin-bottom: 10px;">Cycle Manifestation</h3>
                    <p style="font-size: 0.8rem; color: #d0bce0; margin-bottom: 15px;">أدخلي تفاصيل دورتك لتزهر اللافندر</p>
                    <label style="font-size: 0.75rem; color: var(--gold-light); display: block; text-align: right;">تاريخ آخر حيض:</label>
                    <input type="date" id="last-date" class="royal-input">
                    <label style="font-size: 0.75rem; color: var(--gold-light); display: block; text-align: right;">مدة الدورة (أيام):</label>
                    <input type="number" id="cycle-len" class="royal-input" value="28" min="20" max="45">
                    <button class="royal-btn" onclick="saveCycle()">حفظ البدء 🪻</button>
                </div>
            </div>

            <!-- 3. الشاشة الأساسية: أصيص اللافندر (تظهر بعد تخطي كلمة السر والدورة) -->
            <div id="screen-lavender" class="screen">
                <div class="lavender-container">
                    <div style="height: 180px; display: flex; gap: 15px; align-items: flex-end; justify-content: center; margin-bottom: 10px;">
                        <div style="width: 4px; height: 120px; background: #5a8f5c; position: relative;">
                            <div style="position: absolute; top: -30px; left: -4px; width: 12px; height: 40px; background: #9b7fd4; border-radius: 50%;"></div>
                        </div>
                        <div style="width: 4px; height: 150px; background: #5a8f5c; position: relative;">
                            <div style="position: absolute; top: -40px; left: -4px; width: 12px; height: 50px; background: #9b7fd4; border-radius: 50%;"></div>
                        </div>
                        <div style="width: 4px; height: 130px; background: #5a8f5c; position: relative;">
                            <div style="position: absolute; top: -35px; left: -4px; width: 12px; height: 45px; background: #9b7fd4; border-radius: 50%;"></div>
                        </div>
                    </div>

                    <div class="pot-box">
                        <div class="pot-gear">⚙️</div>
                        <div class="countdown-label" id="countdown-display">15 days until the next cycle</div>
                        <button class="pot-settings-trigger" onclick="openSettings()" title="الإعدادات">⚙</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- شريط التنقل السفلي -->
        <div class="bottom-nav">
            <button class="nav-icon" onclick="navigate('home')">🏠</button>
            <button class="nav-icon" onclick="navigate('book')">📖</button>
            <button class="nav-icon" onclick="openSettings()">⚙️</button>
        </div>

        <!-- نافذة الإعدادات -->
        <div id="settings-modal" class="modal">
            <div class="royal-card" style="max-width: 320px;">
                <h3 style="color: var(--gold); margin-bottom: 15px;">الإعدادات</h3>
                <label style="font-size: 0.75rem; color: var(--gold-light); display: block; text-align: right;">تعديل تاريخ آخر حيض:</label>
                <input type="date" id="edit-date" class="royal-input">
                <button class="royal-btn" onclick="closeSettings()">حفظ التعديلات</button>
                <button class="royal-btn" style="background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d; margin-top: 5px;" onclick="resetApp()">إعادة ضبط التطبيق</button>
            </div>
        </div>
    </div>

    <script>
        let isFirstTime = false;

        window.onload = function() {
            const savedPass = localStorage.getItem('tuhr_password');
            if (!savedPass) {
                isFirstTime = true;
                document.getElementById('pass-title').innerText = "Create Password";
                document.getElementById('pass-desc').innerText = "أنشئي كلمة السر الخاصة بكِ للمرة الأولى";
            }
            showScreen('screen-password');
        };

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function handlePassword() {
            const val = document.getElementById('pass-input').value;
            if(!val) {
                alert('الرجاء إدخال كلمة السر');
                return;
            }

            if (isFirstTime) {
                localStorage.setItem('tuhr_password', val);
                showScreen('screen-cycle'); // أول مرة تروح لبيانات الدورة
            } else {
                const savedPass = localStorage.getItem('tuhr_password');
                if (val === savedPass) {
                    const cycle = localStorage.getItem('tuhr_cycle_data');
                    if (cycle) {
                        showScreen('screen-lavender');
                        calculateCountdown();
                    } else {
                        showScreen('screen-cycle');
                    }
                } else {
                    alert('كلمة السر غير صحيحة');
                }
            }
        }

        function saveCycle() {
            const lastDate = document.getElementById('last-date').value;
            const len = document.getElementById('cycle-len').value;
            if(!lastDate) {
                alert('الرجاء اختيار التاريخ');
                return;
            }
            localStorage.setItem('tuhr_cycle_data', JSON.stringify({ lastDate, len }));
            showScreen('screen-lavender');
            calculateCountdown();
        }

        function calculateCountdown() {
            const data = JSON.parse(localStorage.getItem('tuhr_cycle_data'));
            if(data) {
                const last = new Date(data.lastDate);
                const next = new Date(last.getTime() + (parseInt(data.len) * 24 * 60 * 60 * 1000));
                const today = new Date();
                const diffDays = Math.ceil((next - today) / (1000 * 60 * 60 * 24));
                document.getElementById('countdown-display').innerText = diffDays > 0 ? `${diffDays} days until the next cycle` : 'اليوم المتوقع للدورة';
            }
        }

        function openSettings() {
            document.getElementById('settings-modal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('active');
        }

        function resetApp() {
            localStorage.clear();
            location.reload();
        }

        function navigate(dest) {
            if(dest === 'home') {
                const cycle = localStorage.getItem('tuhr_cycle_data');
                if(cycle) showScreen('screen-lavender');
                else showScreen('screen-cycle');
            } else if(dest === 'book') {
                alert('سجل الملاحظات واليوميات قريباً...');
            }
        }
    </script>
</body>
</html>
