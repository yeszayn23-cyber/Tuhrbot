<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق طُهࢪ الملكي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6b46c1;
            --primary-light: #9f7aea;
            --accent: #d6bcfa;
            --gold: #d4af37;
            --gold-light: #f6e05e;
            --bg-grad: linear-gradient(135deg, #2d1b4e 0%, #1a102f 100%);
            --card-bg: rgba(255, 255, 255, 0.07);
            --text-color: #f7fafc;
            --text-muted: #cbd5e0;
            --border-color: rgba(212, 175, 55, 0.3);
        }

        [data-theme="light"] {
            --bg-grad: linear-gradient(135deg, #f3e8ff 0%, #fae8ff 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-color: #2d3748;
            --text-muted: #4a5568;
            --border-color: rgba(107, 70, 193, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: var(--bg-grad);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* زر المالك و الاعدادات العلوي */
        .top-admin-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 100;
        }

        .admin-dots-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--gold);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            font-size: 1.1rem;
            transition: 0.2s;
        }

        .admin-dots-btn:hover {
            transform: scale(1.05);
            background: var(--primary);
            color: #fff;
        }

        /* حاوية الصفحات */
        .app-container {
            flex: 1;
            padding: 20px 15px 90px 15px;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            position: relative;
        }

        .page {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* الهيدر والعنوان */
        .header-title {
            text-align: center;
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            color: var(--gold);
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        /* بطاقات زجاجية */
        .royal-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        /* شريط البحث العلوي */
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            color: var(--text-color);
            outline: none;
            font-size: 0.95rem;
        }

        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
        }

        /* شريط التنقل السفلي */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 16, 47, 0.9);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 1000;
        }

        [data-theme="light"] .bottom-nav {
            background: rgba(255, 255, 255, 0.9);
        }

        .nav-item {
            color: var(--text-muted);
            text-align: center;
            text-decoration: none;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            background: none;
            border: none;
            flex: 1;
        }

        .nav-item i {
            font-size: 1.3rem;
            display: block;
            margin-bottom: 4px;
        }

        .nav-item.active {
            color: var(--gold);
            transform: translateY(-2px);
        }

        /* محتوى البروفايل */
        .profile-header {
            text-align: center;
            position: relative;
        }

        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            object-fit: cover;
            margin: 0 auto 10px auto;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .profile-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .profile-bio {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* زر الإعدادات الشخصية للمستخدم */
        .user-settings-btn {
            position: absolute;
            top: 0;
            left: 0;
            background: none;
            border: none;
            color: var(--gold);
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* قسم الخواطر */
        .thought-card {
            position: relative;
            margin-bottom: 15px;
        }

        .thought-actions {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 10px;
        }

        .thought-actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .thought-actions button:hover {
            color: var(--gold);
        }

        /* المودال والقوائم المنبثقة */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-grad);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .modal-content h3 {
            color: var(--gold);
            margin-bottom: 15px;
            font-family: 'Amiri', serif;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-color);
            outline: none;
        }

        .royal-btn {
            background: linear-gradient(135deg, var(--gold), #b8860b);
            color: #1a102f;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        .royal-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        /* زر إضافة خواطر عائم */
        .fab-btn {
            position: fixed;
            bottom: 75px;
            right: 20px;
            background: var(--gold);
            color: #1a102f;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 4px 15px rgba(212,175,55,0.4);
            cursor: pointer;
            border: none;
            z-index: 999;
        }
    </style>
</head>
<body data-theme="dark">

    <!-- زر المالك (يظهر فقط لـ 8421694319) -->
    <div class="top-admin-bar" id="adminBar" style="display: none;">
        <button class="admin-dots-btn" onclick="openAdminModal()"><i class="fa-solid fa-ellipsis-vertical"></i></button>
    </div>

    <div class="app-container">

        <!-- 1. الصفحة الرئيسية (تتبع الدورة) -->
        <div id="page-home" class="page active">
            <h1 class="header-title">طُهࢪ الملكي</h1>
            
            <!-- شريط البحث العلوي (للأشخاص) -->
            <div class="search-box">
                <input type="text" id="userSearchInput" placeholder="البحث عن يوزر شخص في تيليجرام..." oninput="searchTelegramUser()">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <div id="searchResultCard" style="display:none;" class="royal-card"></div>

            <!-- بطاقة حساب الدورة -->
            <div class="royal-card" style="text-align: center;">
                <h3 style="color: var(--gold); font-family: 'Amiri', serif; margin-bottom: 10px;">حاسبة دورة النقاء</h3>
                <div id="cycleStatusText" style="font-size: 1.1rem; margin-bottom: 15px;">جاري حساب أيام الدورة...</div>
                <div style="background: rgba(255,255,255,0.05); border-radius: 15px; padding: 15px;">
                    <p id="daysRemainingText" style="font-size: 0.95rem; color: var(--text-muted);">الموعد المتوقع للقادمة: --</p>
                </div>
            </div>

            <!-- حائط الخواطر المجتمعي -->
            <div id="thoughtsContainer"></div>
        </div>

        <!-- 2. صفحة المكتبة (كتب ومقالات) -->
        <div id="page-library" class="page">
            <h1 class="header-title">المكتبة والمعارف</h1>
            <div class="search-box">
                <input type="text" id="libSearchInput" placeholder="بحث عن كتاب أو مقال..." oninput="searchLibrary()">
                <i class="fa-solid fa-book-open"></i>
            </div>
            
            <h3 style="color: var(--gold); margin: 15px 0 10px 0; font-family: 'Amiri', serif;">الكتب المرفوعة</h3>
            <div id="booksContainer"></div>

            <h3 style="color: var(--gold); margin: 20px 0 10px 0; font-family: 'Amiri', serif;">المقالات المنشورة</h3>
            <div id="articlesContainer"></div>
        </div>

        <!-- 3. صفحة الملف الشخصي -->
        <div id="page-profile" class="page">
            <div class="royal-card profile-header">
                <button class="user-settings-btn" onclick="openUserSettingsModal()"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                <img id="tgAvatar" src="https://via.placeholder.com/90" alt="Avatar" class="profile-avatar">
                <div id="tgName" class="profile-name">اسم المستخدم</div>
                <div id="tgBio" class="profile-bio">نبذة تعريفية أنيقة...</div>
            </div>

            <h3 style="color: var(--gold); margin: 15px 0; font-family: 'Amiri', serif; text-align: center;">خواطري المنشورة</h3>
            <div id="myThoughtsContainer"></div>
        </div>

    </div>

    <!-- زر إضافة خاطرة عائم -->
    <button class="fab-btn" onclick="openThoughtModal()"><i class="fa-solid fa-plus"></i></button>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchPage('home', this)">
            <i class="fa-solid fa-house"></i>
            <span>الرئيسية</span>
        </button>
        <button class="nav-item" onclick="switchPage('library', this)">
            <i class="fa-solid fa-book"></i>
            <span>المكتبة</span>
        </button>
        <button class="nav-item" onclick="switchPage('profile', this)">
            <i class="fa-solid fa-user"></i>
            <span>الملف</span>
        </button>
    </nav>

    <!-- مودال إضافة خاطرة -->
    <div id="thoughtModal" class="modal">
        <div class="modal-content">
            <h3>تدوين خاطرة جديدة</h3>
            <textarea id="thoughtInput" class="form-control" rows="4" placeholder="اكتب خاطرتك بأسلوب راقٍ..."></textarea>
            <button class="royal-btn" onclick="saveThought()">نشر الخاطرة</button>
            <button onclick="closeModal('thoughtModal')" style="background:none; border:none; color:var(--text-muted); width:100%; margin-top:10px; cursor:pointer;">إلغاء</button>
        </div>
    </div>

    <!-- مودال إعدادات المالكة (خاصة بـ 8421694319) -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <h3>لوحة تحكم المالكة</h3>
            <input type="text" id="articleTitle" class="form-control" placeholder="عنوان المقال الجديد">
            <textarea id="articleContent" class="form-control" rows="3" placeholder="محتوى المقال..."></textarea>
            <button class="royal-btn" style="margin-bottom:15px;" onclick="adminAddArticle()">نشر المقال</button>
            
            <input type="text" id="bookTitle" class="form-control" placeholder="عنوان الكتاب">
            <input type="text" id="bookUrl" class="form-control" placeholder="رابط التحميل أو الملف">
            <button class="royal-btn" style="margin-bottom:15px;" onclick="adminAddBook()">إضافة الكتاب</button>

            <label style="font-size: 0.85rem; color: var(--gold); display:block; margin-bottom:5px;">تغيير خلفيات التطبيق:</label>
            <input type="text" id="bgImageUrl" class="form-control" placeholder="رابط صورة الخلفية الجديدة">
            <button class="royal-btn" onclick="adminChangeBg()">تحديث الخلفية للجميع</button>

            <button onclick="closeModal('adminModal')" style="background:none; border:none; color:var(--text-muted); width:100%; margin-top:15px; cursor:pointer;">إغلاق</button>
        </div>
    </div>

    <!-- مودال إعدادات المستخدم الشخصية -->
    <div id="userSettingsModal" class="modal">
        <div class="modal-content">
            <h3>الإعدادات الشخصية</h3>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <span>الوضع الليلي / النهاري</span>
                <button class="royal-btn" style="width: auto; padding: 5px 15px;" onclick="toggleTheme()">تبديل</button>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <span>اللغة (Language)</span>
                <button class="royal-btn" style="width: auto; padding: 5px 15px;" onclick="toggleLang()">EN / AR</button>
            </div>
            <button onclick="closeModal('userSettingsModal')" style="background:none; border:none; color:var(--text-muted); width:100%; margin-top:10px; cursor:pointer;">إغلاق</button>
        </div>
    </div>

    <script>
        // بيانات تيليجرام والافتراضية
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        let user = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : {
            id: 8421694319, // افتراضي للتجارب المحلية للمالكة
            first_name: "Zayneb",
            username: "zayneb_yes",
            photo_url: "https://via.placeholder.com/90"
        };

        // التحقق من الآيدي المعتمد للمالكة
        if (user.id == 8421694319) {
            document.getElementById('adminBar').style.display = 'block';
        }

        // تعبئة بيانات البروفايل
        document.getElementById('tgName').innerText = user.first_name || "مستخدم طُهࢪ";
        if(user.photo_url) document.getElementById('tgAvatar').src = user.photo_url;
        document.getElementById('tgBio').innerText = "@" + (user.username || "TuharUser") + " • باحثة ونقية";

        // التنقل بين الصفحات
        function switchPage(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            btn.classList.add('active');
        }

        // حساب الدورة البسيط
        function calculateCycle() {
            let cycleLength = 28;
            let periodLength = 6;
            // تاريخ افتراضي لآخر دورة لأغراض العرض
            let lastPeriod = new Date('2026-07-25');
            let today = new Date();
            let diffDays = Math.floor((today - lastPeriod) / (1000 * 60 * 60 * 24));
            let currentDay = (diffDays % cycleLength) + 1;
            let status = currentDay <= periodLength ? "فترة الحيض المباركة" : "فترة الطهر والنقاء ✨";
            let remaining = cycleLength - currentDay;

            document.getElementById('cycleStatusText').innerText = `أنتِ اليوم في: اليوم ${currentDay} (${status})`;
            document.getElementById('daysRemainingText').innerText = `الموعد المتوقع للدورة القادمة خلال: ${remaining} يوم`;
        }
        calculateCycle();

        // إدارة الخواطر (تخزين محلي مع إمكانية التعديل والحذف)
        let thoughts = JSON.parse(localStorage.getItem('tuhar_thoughts')) || [
            { id: 1, userId: 8421694319, name: "Zayneb", text: "السكينة هي غاية الروح، حين يختفي صخب العالم.", likes: 4 }
        ];

        function renderThoughts() {
            let html = '';
            let myHtml = '';
            thoughts.forEach(t => {
                let isOwner = t.userId == user.id;
                let cardHtml = `
                    <div class="royal-card thought-card">
                        <div style="font-weight: 700; color: var(--gold); margin-bottom: 5px;">${t.name}</div>
                        <p style="font-size: 0.95rem; margin-bottom: 10px;">${t.text}</p>
                        ${isOwner ? `
                            <div class="thought-actions">
                                <button onclick="editThought(${t.id})"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteThought(${t.id})"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        ` : ''}
                    </div>
                `;
                html += cardHtml;
                if(isOwner) myHtml += cardHtml;
            });
            document.getElementById('thoughtsContainer').innerHTML = html;
            document.getElementById('myThoughtsContainer').innerHTML = myHtml || '<p style="text-align:center; color:var(--text-muted);">لا توجد خواطر منشورة بعد.</p>';
        }
        renderThoughts();

        function openThoughtModal() { document.getElementById('thoughtModal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function saveThought() {
            let text = document.getElementById('thoughtInput').value;
            if(!text) return;
            thoughts.unshift({ id: Date.now(), userId: user.id, name: user.first_name, text: text, likes: 0 });
            localStorage.setItem('tuhar_thoughts', JSON.stringify(thoughts));
            document.getElementById('thoughtInput').value = '';
            closeModal('thoughtModal');
            renderThoughts();
        }

        function deleteThought(id) {
            thoughts = thoughts.filter(t => t.id !== id);
            localStorage.setItem('tuhar_thoughts', JSON.stringify(thoughts));
            renderThoughts();
        }

        function editThought(id) {
            let t = thoughts.find(item => item.id === id);
            if(!t) return;
            let newText = prompt("عدلي خاطرتك:", t.text);
            if(newText) {
                t.text = newText;
                localStorage.setItem('tuhar_thoughts', JSON.stringify(thoughts));
                renderThoughts();
            }
        }

        // المكتبة (كتب ومقالات)
        let books = JSON.parse(localStorage.getItem('tuhar_books')) || [{title: "رياض الصالحين (مختصر)", url: "#"}];
        let articles = JSON.parse(localStorage.getItem('tuhar_articles')) || [{title: "معاني الطهارة في القلب", content: "الطهارة الحقيقية تبدأ من نقاء السريرة..."}];

        function renderLibrary() {
            let bHtml = '';
            books.forEach(b => {
                bHtml += `<div class="royal-card" style="padding: 12px; display:flex; justify-content:space-between; align-items:center;">
                    <span><i class="fa-solid fa-book" style="color:var(--gold); margin-left:8px;"></i> ${b.title}</span>
                    <a href="${b.url}" style="color:var(--gold-light); font-size:0.9rem;" target="_blank">تصفح</a>
                </div>`;
            });
            document.getElementById('booksContainer').innerHTML = bHtml;

            let aHtml = '';
            articles.forEach(a => {
                aHtml += `<div class="royal-card">
                    <h4 style="color:var(--gold); margin-bottom:5px; font-family:'Amiri',serif;">${a.title}</h4>
                    <p style="font-size:0.9rem; color:var(--text-muted);">${a.content}</p>
                </div>`;
            });
            document.getElementById('articlesContainer').innerHTML = aHtml;
        }
        renderLibrary();

        // لوحة تحكم المالكة
        function openAdminModal() { document.getElementById('adminModal').style.display = 'flex'; }
        
        function adminAddArticle() {
            let title = document.getElementById('articleTitle').value;
            let content = document.getElementById('articleContent').value;
            if(!title || !content) return;
            articles.unshift({title, content});
            localStorage.setItem('tuhar_articles', JSON.stringify(articles));
            document.getElementById('articleTitle').value = '';
            document.getElementById('articleContent').value = '';
            closeModal('adminModal');
            renderLibrary();
        }

        function adminAddBook() {
            let title = document.getElementById('bookTitle').value;
            let url = document.getElementById('bookUrl').value || "#";
            if(!title) return;
            books.unshift({title, url});
            localStorage.setItem('tuhar_books', JSON.stringify(books));
            document.getElementById('bookTitle').value = '';
            document.getElementById('bookUrl').value = '';
            closeModal('adminModal');
            renderLibrary();
        }

        function adminChangeBg() {
            let url = document.getElementById('bgImageUrl').value;
            if(!url) return;
            document.body.style.background = `linear-gradient(135deg, rgba(45,27,78,0.85), rgba(26,16,47,0.85)), url('${url}') no-repeat center center fixed`;
            document.body.style.backgroundSize = 'cover';
            closeModal('adminModal');
        }

        // إعدادات المستخدم (ثلاث نقاط البروفايل)
        function openUserSettingsModal() { document.getElementById('userSettingsModal').style.display = 'flex'; }
        
        function toggleTheme() {
            let current = document.body.getAttribute('data-theme');
            document.body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        }

        function toggleLang() {
            alert("تم التبديل بنجاح (English mode coming soon)");
